<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Controle de Gastos</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
body{font-family:system-ui,-apple-system,sans-serif}
.card{background:#fff;border-radius:1rem;box-shadow:0 4px 6px -1px rgba(0,0,0,.1);border:1px solid #e2e8f0}
.btn{padding:.5rem 1rem;border-radius:.75rem;font-weight:500;cursor:pointer;border:none;transition:all .2s}
.btn-primary{background:#0284c7;color:#fff}.btn-primary:hover{background:#0369a1}
.btn-secondary{background:#e2e8f0;color:#1e293b}.btn-secondary:hover{background:#cbd5e1}
.btn-danger{background:#ef4444;color:#fff}.btn-danger:hover{background:#dc2626}
.input{width:100%;padding:.625rem 1rem;border-radius:.75rem;border:1px solid #cbd5e1;background:#fff;outline:none}
.input:focus{border-color:#0ea5e9;box-shadow:0 0 0 2px #0ea5e940}
.label{display:block;font-size:.875rem;font-weight:500;color:#475569;margin-bottom:.375rem}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(4px);z-index:50;display:flex;align-items:center;justify-content:center;padding:1rem}
.badge{display:inline-flex;align-items:center;padding:.125rem .625rem;border-radius:9999px;font-size:.75rem;font-weight:500}
.nav-item{display:flex;align-items:center;gap:.75rem;padding:.75rem 1rem;border-radius:.75rem;cursor:pointer;transition:all .15s}
.nav-item.active{background:#e0f2fe;color:#0369a1;font-weight:600}
.nav-item:not(.active){color:#64748b}.nav-item:not(.active):hover{background:#f1f5f9}
</style>
</head>
<body class="bg-slate-100 text-slate-900 min-h-screen">
<div id="app" class="flex min-h-screen">
<aside class="w-64 bg-white border-r border-slate-200 flex-shrink-0 hidden md:flex flex-col">
<div class="p-6 border-b border-slate-200">
<h1 class="text-xl font-bold text-sky-600 flex items-center gap-2"><span>💰</span> Controle de Gastos</h1>
<p class="text-xs text-slate-500 mt-1">Seu painel pessoal</p>
</div>
<nav class="flex-1 p-4 space-y-1">
<div class="nav-item active" data-page="dashboard" onclick="navigate('dashboard')">📊 Dashboard</div>
<div class="nav-item" data-page="faturas" onclick="navigate('faturas')">📄 Faturas</div>
<div class="nav-item" data-page="bancos" onclick="navigate('bancos')">🏦 Bancos</div>
<div class="nav-item" data-page="categorias" onclick="navigate('categorias')">🏷️ Categorias</div>
<div class="nav-item" data-page="lancamentos" onclick="navigate('lancamentos')">➕ Lançamentos</div>
</nav>
<div class="p-4 border-t border-slate-200 text-xs text-slate-500">Dados salvos localmente no seu navegador</div>
</aside>
<div class="md:hidden fixed top-0 left-0 right-0 bg-white border-b border-slate-200 z-40 px-4 py-3 flex items-center justify-between">
<h1 class="font-bold text-sky-600">💰 Controle de Gastos</h1>
<button onclick="toggleMobileMenu()" class="p-2 rounded-lg hover:bg-slate-100 text-xl">☰</button>
</div>
<div id="mobileMenu" class="md:hidden fixed inset-0 bg-black/50 z-50 hidden" onclick="toggleMobileMenu()">
<div class="bg-white w-64 h-full p-4" onclick="event.stopPropagation()">
<div class="flex justify-between items-center mb-6"><h2 class="font-bold text-sky-600">Menu</h2><button onclick="toggleMobileMenu()" class="p-2 text-xl">✕</button></div>
<nav class="space-y-1">
<div class="nav-item active" data-page="dashboard" onclick="navigate('dashboard');toggleMobileMenu()">📊 Dashboard</div>
<div class="nav-item" data-page="faturas" onclick="navigate('faturas');toggleMobileMenu()">📄 Faturas</div>
<div class="nav-item" data-page="bancos" onclick="navigate('bancos');toggleMobileMenu()">🏦 Bancos</div>
<div class="nav-item" data-page="categorias" onclick="navigate('categorias');toggleMobileMenu()">🏷️ Categorias</div>
<div class="nav-item" data-page="lancamentos" onclick="navigate('lancamentos');toggleMobileMenu()">➕ Lançamentos</div>
</nav>
</div>
</div>
<main class="flex-1 overflow-auto pt-16 md:pt-0"><div id="content" class="p-4 md:p-8 max-w-7xl mx-auto"></div></main>
</div>
<div id="modal" class="hidden"></div>
<script>
const STORAGE_KEY='controle_gastos_v1';
const defaultData={bancos:[],categorias:[{id:'cat1',nome:'Alimentação',cor:'#ef4444'},{id:'cat2',nome:'Transporte',cor:'#f59e0b'},{id:'cat3',nome:'Moradia',cor:'#10b981'},{id:'cat4',nome:'Lazer',cor:'#8b5cf6'},{id:'cat5',nome:'Saúde',cor:'#ec4899'},{id:'cat6',nome:'Outros',cor:'#6b7280'}],faturas:[],lancamentos:[]};
function loadData(){try{const r=localStorage.getItem(STORAGE_KEY);if(r)return JSON.parse(r)}catch(e){}return JSON.parse(JSON.stringify(defaultData))}
function saveData(d){localStorage.setItem(STORAGE_KEY,JSON.stringify(d))}
let data=loadData();
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function formatMoney(v){return new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL'}).format(v||0)}
function formatDate(d){if(!d)return'—';const[y,m,day]=d.split('-');return day+'/'+m+'/'+y}
function today(){return new Date().toISOString().slice(0,10)}
function getFaturaTotal(id){const f=data.faturas.find(x=>x.id===id);if(!f)return 0;return(f.valorInicial||0)+data.lancamentos.filter(l=>l.faturaId===id).reduce((s,l)=>s+(l.valor||0),0)}
function isFaturaAberta(f){return!f.dataFechamento||f.dataFechamento>=today()}
function getGastosPorCategoria(){const m={};data.lancamentos.forEach(l=>{const c=data.categorias.find(x=>x.id===l.categoriaId);const n=c?c.nome:'Sem categoria';m[n]=(m[n]||0)+(l.valor||0)});return m}
function getGastosPorBanco(){const m={};data.faturas.forEach(f=>{const b=data.bancos.find(x=>x.id===f.bancoId);const n=b?b.nome:'Sem banco';m[n]=(m[n]||0)+getFaturaTotal(f.id)});return m}
function showModal(html){const el=document.getElementById('modal');el.innerHTML='<div class="modal-bg" onclick="if(event.target===this)closeModal()">'+html+'</div>';el.classList.remove('hidden')}
function closeModal(){document.getElementById('modal').classList.add('hidden');document.getElementById('modal').innerHTML=''}
function toast(msg){const t=document.createElement('div');t.style.cssText='position:fixed;bottom:1.5rem;right:1.5rem;z-index:100;padding:.75rem 1.25rem;border-radius:.75rem;background:#059669;color:#fff;font-weight:500;box-shadow:0 10px 15px -3px rgba(0,0,0,.1)';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2800)}
function toggleMobileMenu(){document.getElementById('mobileMenu').classList.toggle('hidden')}
let currentPage='dashboard';
function navigate(page){currentPage=page;document.querySelectorAll('.nav-item').forEach(el=>el.classList.toggle('active',el.dataset.page===page));render()}
function renderDashboard(){const totalGeral=data.faturas.reduce((s,f)=>s+getFaturaTotal(f.id),0);const abertas=data.faturas.filter(isFaturaAberta);const fechadas=data.faturas.filter(f=>!isFaturaAberta(f));const totalMes=data.lancamentos.filter(l=>l.data&&l.data.startsWith(today().slice(0,7))).reduce((s,l)=>s+l.valor,0);return`<div class="mb-8"><h2 class="text-2xl md:text-3xl font-bold">Dashboard</h2><p class="text-slate-500 mt-1">Visão geral dos seus gastos</p></div><div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-8"><div class="card p-5"><p class="text-sm text-slate-500">Total em faturas</p><p class="text-2xl font-bold text-sky-600 mt-1">${formatMoney(totalGeral)}</p></div><div class="card p-5"><p class="text-sm text-slate-500">Gastos este mês</p><p class="text-2xl font-bold text-amber-600 mt-1">${formatMoney(totalMes)}</p></div><div class="card p-5"><p class="text-sm text-slate-500">Faturas abertas</p><p class="text-2xl font-bold text-emerald-600 mt-1">${abertas.length}</p></div><div class="card p-5"><p class="text-sm text-slate-500">Faturas fechadas</p><p class="text-2xl font-bold text-slate-600 mt-1">${fechadas.length}</p></div></div><div class="grid grid-cols-1 lg:grid-cols-2 gap-6 mb-8"><div class="card p-5"><h3 class="font-semibold mb-4">Gastos por Categoria</h3><div style="height:16rem"><canvas id="chartCat"></canvas></div></div><div class="card p-5"><h3 class="font-semibold mb-4">Gastos por Banco</h3><div style="height:16rem"><canvas id="chartBanco"></canvas></div></div></div><div class="card p-5"><h3 class="font-semibold mb-4">Faturas em aberto</h3>${abertas.length===0?'<p class="text-slate-500 text-sm">Nenhuma fatura aberta no momento.</p>':`<div class="overflow-x-auto"><table class="w-full text-sm"><thead><tr class="text-left text-slate-500 border-b border-slate-200"><th class="pb-3 pr-4">Fatura</th><th class="pb-3 pr-4">Banco</th><th class="pb-3 pr-4">Fechamento</th><th class="pb-3 text-right">Valor atual</th></tr></thead><tbody>${abertas.map(f=>{const banco=data.bancos.find(b=>b.id===f.bancoId);return`<tr class="border-b border-slate-100 hover:bg-slate-50 cursor-pointer" onclick="navigate('faturas');setTimeout(()=>openFaturaDetail('${f.id}'),100)"><td class="py-3 pr-4 font-medium">${f.nome}</td><td class="py-3 pr-4">${banco?banco.nome:'—'}</td><td class="py-3 pr-4">${formatDate(f.dataFechamento)}</td><td class="py-3 text-right font-semibold text-sky-600">${formatMoney(getFaturaTotal(f.id))}</td></tr>`}).join('')}</tbody></table></div>`}</div>`}
function renderCharts(){const porCat=getGastosPorCategoria();const porBanco=getGastosPorBanco();const catLabels=Object.keys(porCat);const catValues=Object.values(porCat);const catColors=catLabels.map(n=>{const c=data.categorias.find(x=>x.nome===n);return c?c.cor:'#6b7280'});const ctx1=document.getElementById('chartCat');if(ctx1){if(window._chartCat)window._chartCat.destroy();window._chartCat=new Chart(ctx1,{type:'doughnut',data:{labels:catLabels.length?catLabels:['Sem dados'],datasets:[{data:catValues.length?catValues:[1],backgroundColor:catColors.length?catColors:['#e2e8f0'],borderWidth:0}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'bottom'}}}})}const bancoLabels=Object.keys(porBanco);const bancoValues=Object.values(porBanco);const ctx2=document.getElementById('chartBanco');if(ctx2){if(window._chartBanco)window._chartBanco.destroy();window._chartBanco=new Chart(ctx2,{type:'bar',data:{labels:bancoLabels.length?bancoLabels:['Sem dados'],datasets:[{label:'Total',data:bancoValues.length?bancoValues:[0],backgroundColor:'#0ea5e9',borderRadius:8}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,ticks:{callback:v=>'R$ '+v.toLocaleString('pt-BR')}}}}})}}
function renderFaturas(){return`<div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-8"><div><h2 class="text-2xl md:text-3xl font-bold">Faturas</h2><p class="text-slate-500 mt-1">Gerencie suas faturas de cartão e contas</p></div><button class="btn btn-primary" onclick="openFaturaForm()">+ Nova Fatura</button></div>${data.faturas.length===0?`<div class="card p-12 text-center"><p class="text-slate-500 mb-4">Nenhuma fatura cadastrada ainda.</p><button class="btn btn-primary" onclick="openFaturaForm()">Criar primeira fatura</button></div>`:`<div class="grid gap-4">${data.faturas.map(f=>{const banco=data.bancos.find(b=>b.id===f.bancoId);const aberta=isFaturaAberta(f);const total=getFaturaTotal(f.id);const qtd=data.lancamentos.filter(l=>l.faturaId===f.id).length;return`<div class="card p-5 hover:shadow-xl transition-shadow cursor-pointer" onclick="openFaturaDetail('${f.id}')"><div class="flex flex-col sm:flex-row sm:items-center justify-between gap-3"><div><div class="flex items-center gap-2"><h3 class="font-semibold text-lg">${f.nome}</h3><span class="badge ${aberta?'bg-emerald-100 text-emerald-700':'bg-slate-200 text-slate-600'}">${aberta?'Aberta':'Fechada'}</span></div><p class="text-sm text-slate-500 mt-1">${banco?banco.nome:'Sem banco'} · Fecha em ${formatDate(f.dataFechamento)} · ${qtd} lançamento(s)</p></div><div class="text-right"><p class="text-xl font-bold text-sky-600">${formatMoney(total)}</p><p class="text-xs text-slate-500">inicial ${formatMoney(f.valorInicial)}</p></div></div></div>`}).join('')}</div>`}`}
function openFaturaForm(editId){editId=editId||null;const fatura=editId?data.faturas.find(f=>f.id===editId):null;const bancosOpts=data.bancos.map(b=>'<option value="'+b.id+'" '+(fatura&&fatura.bancoId===b.id?'selected':'')+'>'+b.nome+'</option>').join('');showModal(`<div class="card w-full max-w-md p-6" onclick="event.stopPropagation()" style="max-width:28rem"><h3 class="text-xl font-bold mb-5">${fatura?'Editar':'Nova'} Fatura</h3><form onsubmit="saveFatura(event,'${editId||''}')" class="space-y-4"><div><label class="label">Nome da fatura *</label><input class="input" name="nome" required value="${fatura?fatura.nome:''}" placeholder="Ex: Cartão Nubank Outubro"></div><div><label class="label">Banco</label><select class="input" name="bancoId"><option value="">Selecione um banco</option>${bancosOpts}</select></div><div><label class="label">Valor inicial (R$)</label><input class="input" name="valorInicial" type="number" step="0.01" min="0" value="${fatura?fatura.valorInicial:'0'}" placeholder="0.00"></div><div><label class="label">Data de fechamento *</label><input class="input" name="dataFechamento" type="date" required value="${fatura?fatura.dataFechamento:''}"></div><div class="flex gap-3 pt-2"><button type="button" class="btn btn-secondary flex-1" onclick="closeModal()">Cancelar</button><button type="submit" class="btn btn-primary flex-1">Salvar</button></div></form></div>`)}
function saveFatura(e,editId){e.preventDefault();const form=e.target;const obj={id:editId||uid(),nome:form.nome.value.trim(),bancoId:form.bancoId.value||null,valorInicial:parseFloat(form.valorInicial.value)||0,dataFechamento:form.dataFechamento.value};if(editId){const idx=data.faturas.findIndex(f=>f.id===editId);data.faturas[idx]=obj;toast('Fatura atualizada!')}else{data.faturas.push(obj);toast('Fatura criada!')}saveData(data);closeModal();render()}
function openFaturaDetail(id){const f=data.faturas.find(x=>x.id===id);if(!f)return;const banco=data.bancos.find(b=>b.id===f.bancoId);const aberta=isFaturaAberta(f);const total=getFaturaTotal(id);const lancs=data.lancamentos.filter(l=>l.faturaId===id).sort((a,b)=>(b.data||'').localeCompare(a.data||''));showModal(`<div class="card p-6" onclick="event.stopPropagation()" style="max-width:42rem;max-height:90vh;overflow-y:auto;width:100%"><div class="flex items-start justify-between mb-4"><div><h3 class="text-xl font-bold">${f.nome}</h3><p class="text-sm text-slate-500">${banco?banco.nome:'Sem banco'} · Fecha ${formatDate(f.dataFechamento)}</p></div><span class="badge ${aberta?'bg-emerald-100 text-emerald-700':'bg-slate-200 text-slate-600'}">${aberta?'Aberta':'Fechada'}</span></div><div class="grid grid-cols-2 gap-4 mb-6"><div class="bg-slate-50 rounded-xl p-4"><p class="text-xs text-slate-500">Valor inicial</p><p class="text-lg font-semibold">${formatMoney(f.valorInicial)}</p></div><div class="bg-sky-50 rounded-xl p-4"><p class="text-xs text-slate-500">Total atual</p><p class="text-lg font-bold text-sky-600">${formatMoney(total)}</p></div></div><div class="flex gap-2 mb-4 flex-wrap">${aberta?'<button class="btn btn-primary text-sm" onclick="closeModal();openLancamentoForm(null,\''+id+'\')">+ Adicionar compra</button>':''}<button class="btn btn-secondary text-sm" onclick="closeModal();openFaturaForm('${id}')">Editar fatura</button><button class="btn btn-danger text-sm" onclick="deleteFatura('${id}')">Excluir</button></div><h4 class="font-semibold mb-3">Lançamentos (${lancs.length})</h4>${lancs.length===0?'<p class="text-sm text-slate-500">Nenhum lançamento ainda.</p>':`<div class="space-y-2">${lancs.map(l=>{const cat=data.categorias.find(c=>c.id===l.categoriaId);return`<div class="flex items-center justify-between p-3 rounded-xl bg-slate-50"><div><p class="font-medium">${l.descricao||'Sem descrição'}</p><p class="text-xs text-slate-500">${formatDate(l.data)} · ${cat?cat.nome:'—'}</p></div><div class="flex items-center gap-3"><span class="font-semibold text-red-500">${formatMoney(l.valor)}</span><button class="text-slate-400 hover:text-red-500" onclick="deleteLancamento('${l.id}','${id}')">✕</button></div></div>`}).join('')}</div>`}<div class="mt-6"><button class="btn btn-secondary w-full" onclick="closeModal()">Fechar</button></div></div>`)}
function deleteFatura(id){if(!confirm('Excluir esta fatura e todos os lançamentos vinculados?'))return;data.faturas=data.faturas.filter(f=>f.id!==id);data.lancamentos=data.lancamentos.filter(l=>l.faturaId!==id);saveData(data);closeModal();toast('Fatura excluída');render()}
function renderBancos(){return`<div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-8"><div><h2 class="text-2xl md:text-3xl font-bold">Bancos</h2><p class="text-slate-500 mt-1">Cadastre os bancos/cartões que você usa</p></div><button class="btn btn-primary" onclick="openBancoForm()">+ Novo Banco</button></div>${data.bancos.length===0?`<div class="card p-12 text-center"><p class="text-slate-500 mb-4">Nenhum banco cadastrado.</p><button class="btn btn-primary" onclick="openBancoForm()">Adicionar banco</button></div>`:`<div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-4">${data.bancos.map(b=>{const qtd=data.faturas.filter(f=>f.bancoId===b.id).length;return`<div class="card p-5"><div class="flex items-start justify-between"><div><h3 class="font-semibold text-lg">${b.nome}</h3><p class="text-sm text-slate-500 mt-1">${qtd} fatura(s)</p></div><div class="flex gap-1"><button class="p-2 rounded-lg hover:bg-slate-100" onclick="openBancoForm('${b.id}')">✏️</button><button class="p-2 rounded-lg hover:bg-red-50" onclick="deleteBanco('${b.id}')">🗑️</button></div></div></div>`}).join('')}</div>`}`}
function openBancoForm(editId){editId=editId||null;const banco=editId?data.bancos.find(b=>b.id===editId):null;showModal(`<div class="card w-full max-w-md p-6" onclick="event.stopPropagation()" style="max-width:28rem"><h3 class="text-xl font-bold mb-5">${banco?'Editar':'Novo'} Banco</h3><form onsubmit="saveBanco(event,'${editId||''}')" class="space-y-4"><div><label class="label">Nome do banco *</label><input class="input" name="nome" required value="${banco?banco.nome:''}" placeholder="Ex: Nubank, Itaú, Inter..."></div><div class="flex gap-3 pt-2"><button type="button" class="btn btn-secondary flex-1" onclick="closeModal()">Cancelar</button><button type="submit" class="btn btn-primary flex-1">Salvar</button></div></form></div>`)}
function saveBanco(e,editId){e.preventDefault();const nome=e.target.nome.value.trim();if(editId){const idx=data.bancos.findIndex(b=>b.id===editId);data.bancos[idx].nome=nome;toast('Banco atualizado!')}else{data.bancos.push({id:uid(),nome});toast('Banco adicionado!')}saveData(data);closeModal();render()}
function deleteBanco(id){if(!confirm('Excluir este banco? As faturas vinculadas ficarão sem banco.'))return;data.bancos=data.bancos.filter(b=>b.id!==id);data.faturas.forEach(f=>{if(f.bancoId===id)f.bancoId=null});saveData(data);toast('Banco excluído');render()}
function renderCategorias(){return`<div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-8"><div><h2 class="text-2xl md:text-3xl font-bold">Categorias</h2><p class="text-slate-500 mt-1">Organize seus gastos por categoria</p></div><button class="btn btn-primary" onclick="openCategoriaForm()">+ Nova Categoria</button></div><div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-4">${data.categorias.map(c=>{const total=data.lancamentos.filter(l=>l.categoriaId===c.id).reduce((s,l)=>s+l.valor,0);return`<div class="card p-5"><div class="flex items-start justify-between"><div class="flex items-center gap-3"><div class="w-4 h-4 rounded-full" style="background:${c.cor}"></div><div><h3 class="font-semibold">${c.nome}</h3><p class="text-sm text-slate-500">${formatMoney(total)}</p></div></div><div class="flex gap-1"><button class="p-2 rounded-lg hover:bg-slate-100" onclick="openCategoriaForm('${c.id}')">✏️</button><button class="p-2 rounded-lg hover:bg-red-50" onclick="deleteCategoria('${c.id}')">🗑️</button></div></div></div>`}).join('')}</div>`}
function openCategoriaForm(editId){editId=editId||null;const cat=editId?data.categorias.find(c=>c.id===editId):null;showModal(`<div class="card w-full max-w-md p-6" onclick="event.stopPropagation()" style="max-width:28rem"><h3 class="text-xl font-bold mb-5">${cat?'Editar':'Nova'} Categoria</h3><form onsubmit="saveCategoria(event,'${editId||''}')" class="space-y-4"><div><label class="label">Nome *</label><input class="input" name="nome" required value="${cat?cat.nome:''}" placeholder="Ex: Educação, Pets..."></div><div><label class="label">Cor</label><input class="input" name="cor" type="color" value="${cat?cat.cor:'#0ea5e9'}" style="height:3rem"></div><div class="flex gap-3 pt-2"><button type="button" class="btn btn-secondary flex-1" onclick="closeModal()">Cancelar</button><button type="submit" class="btn btn-primary flex-1">Salvar</button></div></form></div>`)}
function saveCategoria(e,editId){e.preventDefault();const nome=e.target.nome.value.trim();const cor=e.target.cor.value;if(editId){const idx=data.categorias.findIndex(c=>c.id===editId);data.categorias[idx]={...data.categorias[idx],nome,cor};toast('Categoria atualizada!')}else{data.categorias.push({id:uid(),nome,cor});toast('Categoria criada!')}saveData(data);closeModal();render()}
function deleteCategoria(id){if(!confirm('Excluir esta categoria? Lançamentos ficarão sem categoria.'))return;data.categorias=data.categorias.filter(c=>c.id!==id);data.lancamentos.forEach(l=>{if(l.categoriaId===id)l.categoriaId=null});saveData(data);toast('Categoria excluída');render()}
function renderLancamentos(){const sorted=[...data.lancamentos].sort((a,b)=>(b.data||'').localeCompare(a.data||''));return`<div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-8"><div><h2 class="text-2xl md:text-3xl font-bold">Lançamentos</h2><p class="text-slate-500 mt-1">Todas as compras e gastos registrados</p></div><button class="btn btn-primary" onclick="openLancamentoForm()">+ Novo Lançamento</button></div>${sorted.length===0?`<div class="card p-12 text-center"><p class="text-slate-500 mb-4">Nenhum lançamento ainda.</p><button class="btn btn-primary" onclick="openLancamentoForm()">Adicionar primeiro</button></div>`:`<div class="card overflow-hidden"><div class="overflow-x-auto"><table class="w-full text-sm"><thead><tr class="text-left text-slate-500 bg-slate-50"><th class="px-4 py-3">Data</th><th class="px-4 py-3">Descrição</th><th class="px-4 py-3">Fatura</th><th class="px-4 py-3">Categoria</th><th class="px-4 py-3 text-right">Valor</th><th class="px-4 py-3"></th></tr></thead><tbody>${sorted.map(l=>{const fatura=data.faturas.find(f=>f.id===l.faturaId);const cat=data.categorias.find(c=>c.id===l.categoriaId);return`<tr class="border-t border-slate-100 hover:bg-slate-50"><td class="px-4 py-3 whitespace-nowrap">${formatDate(l.data)}</td><td class="px-4 py-3">${l.descricao||'—'}</td><td class="px-4 py-3">${fatura?fatura.nome:'—'}</td><td class="px-4 py-3">${cat?'<span class="badge" style="background:'+cat.cor+'22;color:'+cat.cor+'">'+cat.nome+'</span>':'—'}</td><td class="px-4 py-3 text-right font-semibold text-red-500">${formatMoney(l.valor)}</td><td class="px-4 py-3"><button class="text-slate-400 hover:text-red-500" onclick="deleteLancamento('${l.id}')">✕</button></td></tr>`}).join('')}</tbody></table></div></div>`}`}
function openLancamentoForm(editId,faturaIdPre){editId=editId||null;faturaIdPre=faturaIdPre||null;const lanc=editId?data.lancamentos.find(l=>l.id===editId):null;const faturasAbertas=data.faturas.filter(isFaturaAberta);const lista=faturasAbertas.length?faturasAbertas:data.faturas;const faturaOpts=lista.map(f=>'<option value="'+f.id+'" '+((lanc&&lanc.faturaId===f.id)||faturaIdPre===f.id?'selected':'')+'>'+f.nome+'</option>').join('');const catOpts=data.categorias.map(c=>'<option value="'+c.id+'" '+(lanc&&lanc.categoriaId===c.id?'selected':'')+'>'+c.nome+'</option>').join('');showModal(`<div class="card w-full max-w-md p-6" onclick="event.stopPropagation()" style="max-width:28rem"><h3 class="text-xl font-bold mb-5">${lanc?'Editar':'Novo'} Lançamento</h3><form onsubmit="saveLancamento(event,'${editId||''}')" class="space-y-4"><div><label class="label">Fatura *</label><select class="input" name="faturaId" required><option value="">Selecione a fatura</option>${faturaOpts}</select></div><div><label class="label">Descrição</label><input class="input" name="descricao" value="${lanc?(lanc.descricao||''):''}" placeholder="Ex: Mercado, Uber, Netflix..."></div><div><label class="label">Valor (R$) *</label><input class="input" name="valor" type="number" step="0.01" min="0.01" required value="${lanc?lanc.valor:''}" placeholder="0.00"></div><div><label class="label">Categoria</label><select class="input" name="categoriaId"><option value="">Sem categoria</option>${catOpts}</select></div><div><label class="label">Data *</label><input class="input" name="data" type="date" required value="${lanc?lanc.data:today()}"></div><div class="flex gap-3 pt-2"><button type="button" class="btn btn-secondary flex-1" onclick="closeModal()">Cancelar</button><button type="submit" class="btn btn-primary flex-1">Salvar</button></div></form></div>`)}
function saveLancamento(e,editId){e.preventDefault();const form=e.target;const obj={id:editId||uid(),faturaId:form.faturaId.value,descricao:form.descricao.value.trim(),valor:parseFloat(form.valor.value)||0,categoriaId:form.categoriaId.value||null,data:form.data.value};if(editId){const idx=data.lancamentos.findIndex(l=>l.id===editId);data.lancamentos[idx]=obj;toast('Lançamento atualizado!')}else{data.lancamentos.push(obj);toast('Lançamento adicionado!')}saveData(data);closeModal();render()}
function deleteLancamento(id,reopenFaturaId){if(!confirm('Excluir este lançamento?'))return;data.lancamentos=data.lancamentos.filter(l=>l.id!==id);saveData(data);toast('Lançamento excluído');if(reopenFaturaId){closeModal();openFaturaDetail(reopenFaturaId)}else{render()}}
function render(){const content=document.getElementById('content');if(currentPage==='dashboard'){content.innerHTML=renderDashboard();setTimeout(renderCharts,50)}else if(currentPage==='faturas'){content.innerHTML=renderFaturas()}else if(currentPage==='bancos'){content.innerHTML=renderBancos()}else if(currentPage==='categorias'){content.innerHTML=renderCategorias()}else if(currentPage==='lancamentos'){content.innerHTML=renderLancamentos()}}
render();
</script>
</body>
</html>
